name: habit_tracker
description: Habit Tracker Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # HTTP & Networking
  dio: ^5.4.3

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # Secure Storage (JWT token)
  flutter_secure_storage: ^9.2.2

  # Local Notifications (reminder)
  flutter_local_notifications: ^17.2.3

  # Image Upload
  image_picker: ^1.1.2

  # Date & Time formatting
  intl: ^0.19.0

  # Google Fonts (Syne + DM Sans — same as web)
  google_fonts: ^6.2.1

  # Sharing & file system (snapshot feature)
  share_plus: ^10.0.2
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
